name: RaceDay CI

on:
  push:
    branches: [ main, part-2 ]
  pull_request:
    branches: [ main, part-2 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.Tests/RaceDay.Tests.csproj

      - name: Build
        run: dotnet build RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-build --verbosity normal
